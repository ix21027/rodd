name: Run Appp
on:
  schedule:
    - cron: '*/13 5-18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei xvfb chromium-browser
      
      - name: Run App
        id: run-app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          id1: ${{ secrets.id1 }}
          LINK: ${{ secrets.LINK }}
        run: |
          chmod +x rodd
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./rodd
      
      - name: Commit and Push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add img/2037.png img/837.png
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update images [skip ci]"
            git push
          else
            echo "No changes detected."
          fi

          
      # - name: Deploy Images
      #   if: steps.run-app.outputs.updated == 'true'
      #   run: