name: Run Appp
on:
  schedule:
    - cron: '*/13 5-18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Chrome Binary
        id: cache-chrome
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/chrome-bin
          key: ${{ runner.os }}-chrome-1520176

      - name: Download Chrome if not cached
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/chrome-bin
          REVISION=1520176
          URL="https://www.googleapis.com/download/storage/v1/b/chromium-browser-snapshots/o/Linux_x64%2F${REVISION}%2Fchrome-linux.zip?alt=media"
          curl -SL "$URL" -o chrome.zip
          unzip chrome.zip
          mv chrome-linux/* ${{ github.workspace }}/chrome-bin/
          rm chrome.zip

      - name: Add Chrome to PATH & Install Dependencies
        run: |
          chmod +x ${{ github.workspace }}/chrome-bin/chrome
          echo "${{ github.workspace }}/chrome-bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei xvfb libnss3 libatk-bridge2.0-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
      
      - name: Run App
        id: run-app
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          id1: ${{ secrets.id1 }}
          LINK: ${{ secrets.LINK }}
        run: |
          chmod +x rodd
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./rodd
      
      - name: Commit and Push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add img/2037.png img/837.png
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update images [skip ci]"
            git push
          else
            echo "No changes detected."
          fi

          
      # - name: Deploy Images
      #   if: steps.run-app.outputs.updated == 'true'
      #   run: